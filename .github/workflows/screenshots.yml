name: Screenshots

# Manually triggered: runs the real app on Windows through a realistic session
# and publishes the screenshots to the "screenshots" branch.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'screens (one shot per screen) or journey (import → analytics, numbered steps)'
        type: choice
        options: [screens, journey]
        default: screens

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Raise screen resolution
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache FFmpeg download
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/.cache
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg-sources.json') }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx electron-vite build

      - name: Capture screenshots
        run: npx playwright test --project=screenshots tests/screenshots/${{ inputs.suite || 'screens' }}.spec.ts

      - name: Publish to the screenshots branch
        if: always()
        run: |
          mkdir /tmp/shots && cp screenshots/*.png /tmp/shots/ && (cp screenshots/*.json /tmp/shots/ 2>/dev/null || true)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan screenshots-tmp
          git rm -rf --cached . > /dev/null
          git clean -fdx -e node_modules > /dev/null || true
          cp /tmp/shots/* .
          git add *.png $(ls *.json 2>/dev/null)
          git commit -m "Screenshots from ${GITHUB_SHA::7}"
          BRANCH=screenshots
          if [ "${{ inputs.suite }}" = "journey" ]; then BRANCH=screenshots-journey; fi
          git push --force origin HEAD:$BRANCH
